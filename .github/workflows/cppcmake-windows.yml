name: Build (Windows v4)

on:
  workflow_call:
    inputs:
      NIGHTLY:
        default: false
        type: boolean
      CONSOLIDATE_DEPENDENCY_SUMMARY:
        default: false
        type: boolean
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-v4-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: powershell

jobs:
  build:
    name: windows-2022-x64-release
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      BUILD_CONFIGURATION: Release
      QT_VERSION: 6.11.1
      QT_ARCH: win64_msvc2022_64
      WINDOWS_SDK_VERSION: 10.0.26100.0
      NASM_VERSION: 2.16.3

    steps:
      - name: Checkout repository and pinned dependencies
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Validate checkout
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:GITHUB_WORKSPACE -match '\s') {
            throw "SQLCipher requires a checkout path without spaces: $env:GITHUB_WORKSPACE"
          }

          $submoduleStatus = @(git submodule status --recursive)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect the recursive submodule checkout.'
          }

          $uninitialised = $submoduleStatus |
            Where-Object { $_ -match '^[-+U]' }
          if ($uninitialised) {
            throw "One or more pinned submodules are not checked out correctly:`n$($uninitialised -join "`n")"
          }

          $submoduleStatus | Write-Host

      - name: Fetch and validate pinned dependency tags
        run: |
          $ErrorActionPreference = 'Stop'

          $dependencies = @(
            @{ Path = 'third_party/zlib/src'; Tag = 'v1.3.2' }
            @{ Path = 'third_party/zstd/src'; Tag = 'v1.5.7' }
            @{ Path = 'third_party/brotli/src'; Tag = 'v1.2.0' }
            @{ Path = 'third_party/sqlcipher/src'; Tag = 'v4.18.0' }
            @{ Path = 'third_party/openssl/src'; Tag = 'openssl-3.5.7' }
          )

          foreach ($dependency in $dependencies) {
            $tagRef = "refs/tags/$($dependency.Tag)"

            git -C $dependency.Path fetch `
              --force `
              --depth=1 `
              origin `
              "${tagRef}:${tagRef}"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to fetch $($dependency.Tag) for $($dependency.Path)."
            }

            $actualTag = git -C $dependency.Path describe --tags --exact-match
            if ($LASTEXITCODE -ne 0 -or $actualTag -ne $dependency.Tag) {
              throw "Unexpected tag for $($dependency.Path): $actualTag"
            }

            Write-Host "$($dependency.Path): $actualTag"
          }

      - name: Install NASM
        run: |
          $ErrorActionPreference = 'Stop'

          choco install nasm `
            --version=$env:NASM_VERSION `
            --yes `
            --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey failed to install NASM $env:NASM_VERSION."
          }

          $nasmExe = Join-Path $env:ProgramFiles 'NASM\nasm.exe'
          if (-not (Test-Path -LiteralPath $nasmExe -PathType Leaf)) {
            throw "Chocolatey reported success, but nasm.exe was not found: $nasmExe"
          }

          $nasmDir = Split-Path -Parent $nasmExe
          $nasmDir | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append
          $env:Path = "$nasmDir;$env:Path"

          & $nasmExe -v
          if ($LASTEXITCODE -ne 0) {
            throw 'NASM verification failed.'
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat qtimageformats qtpdf qtwebengine
          cache: true
          cache-key-prefix: sqlitebrowser-qt-6.11.1-msvc2022-x64-aqt-dev
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@9e49c82edc6d946db376dec907cca5b4b486eec5

      - name: Validate Qt runtime inputs
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:QT_ROOT_DIR)) {
            throw 'install-qt-action did not provide QT_ROOT_DIR.'
          }

          $requiredQtFiles = @(
            'bin\Qt6Pdf.dll',
            'plugins\imageformats\qicns.dll',
            'plugins\imageformats\qpdf.dll',
            'plugins\imageformats\qtga.dll',
            'plugins\imageformats\qtiff.dll',
            'plugins\imageformats\qwbmp.dll',
            'plugins\imageformats\qwebp.dll'
          )

          $missingQtFiles = @(
            foreach ($relativePath in $requiredQtFiles) {
              $fullPath = Join-Path $env:QT_ROOT_DIR $relativePath
              if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
                $relativePath
              }
            }
          )

          if ($missingQtFiles.Count -ne 0) {
            throw "Qt 6.11.1 runtime inputs are missing:`n  $($missingQtFiles -join "`n  ")"
          }

          Write-Host "Validated $($requiredQtFiles.Count) Qt runtime inputs."

      - name: Create local CMake Presets
        run: |
          $ErrorActionPreference = 'Stop'

          $templatePath = Join-Path $env:GITHUB_WORKSPACE 'CMakePresets.template.json'
          $presetPath = Join-Path $env:GITHUB_WORKSPACE 'CMakePresets.json'
          $placeholder = 'REPLACE_WITH_QT_6_11_1_MSVC2022_X64_ROOT'

          if (-not (Test-Path -LiteralPath $templatePath -PathType Leaf)) {
            throw "CMake Preset template is missing: $templatePath"
          }
          if ([string]::IsNullOrWhiteSpace($env:QT_ROOT_DIR)) {
            throw 'install-qt-action did not provide QT_ROOT_DIR.'
          }

          $qtRoot = [IO.Path]::GetFullPath($env:QT_ROOT_DIR)
          $qmake = Join-Path $qtRoot 'bin\qmake.exe'
          if (-not (Test-Path -LiteralPath $qmake -PathType Leaf)) {
            throw "Qt 6.11.1 qmake.exe is missing: $qmake"
          }

          $template = [IO.File]::ReadAllText($templatePath)
          $placeholderCount = [regex]::Matches(
            $template,
            [regex]::Escape($placeholder)
          ).Count
          if ($placeholderCount -ne 1) {
            throw "Expected exactly one Qt placeholder in the CMake Preset template; found $placeholderCount."
          }

          $preset = $template.Replace($placeholder, $qtRoot.Replace('\', '/'))
          $utf8NoBom = New-Object Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($presetPath, $preset, $utf8NoBom)

          if ([IO.File]::ReadAllText($presetPath).Contains($placeholder)) {
            throw 'The generated CMakePresets.json still contains the Qt placeholder.'
          }

          & $qmake --version
          if ($LASTEXITCODE -ne 0) {
            throw 'qmake --version failed.'
          }

          cmake --list-presets=all
          if ($LASTEXITCODE -ne 0) {
            throw 'The generated CMakePresets.json is invalid.'
          }

      - name: Record build environment
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Runner image: $env:ImageOS $env:ImageVersion"
          Write-Host "Required Windows SDK: $env:WINDOWS_SDK_VERSION"
          git --version
          cmake --version
          perl -e 'print qq(Perl: $^V\n)'
          nasm -v

          $vsRoots = @(
            'C:\Program Files\Microsoft Visual Studio\2022\Community',
            'C:\Program Files\Microsoft Visual Studio\2022\Professional',
            'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          )
          $vsRoot = $vsRoots |
            Where-Object {
              Test-Path -LiteralPath (Join-Path $_ 'Common7\Tools\VsDevCmd.bat')
            } |
            Select-Object -First 1
          if (-not $vsRoot) {
            throw 'No supported default Visual Studio 2022 installation was found.'
          }
          Write-Host "Visual Studio: $vsRoot"

      - name: Build and stage dependencies
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File third_party\build-all.ps1 `
            -Action Build `
            -Configuration $env:BUILD_CONFIGURATION
          if ($LASTEXITCODE -ne 0) {
            throw 'Dependency build failed.'
          }

      - name: Test dependencies
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File third_party\build-all.ps1 `
            -Action Test `
            -Configuration $env:BUILD_CONFIGURATION `
            -OpenSSLTestMode Safe
          if ($LASTEXITCODE -ne 0) {
            throw 'Dependency tests failed.'
          }

      - name: Publish and verify dependency aggregate
        run: |
          third_party\aggregate.cmd build release
          if ($LASTEXITCODE -ne 0) {
            throw 'Dependency aggregate publication failed.'
          }

          third_party\aggregate.cmd check release
          if ($LASTEXITCODE -ne 0) {
            throw 'Dependency aggregate verification failed.'
          }

      - name: Build and run application unit tests
        run: |
          cmake --workflow --preset test-release
          if ($LASTEXITCODE -ne 0) {
            throw 'Application unit tests failed.'
          }

      - name: Build and run restricted-PATH runtime smoke tests
        run: |
          cmake --workflow --preset smoke-release
          if ($LASTEXITCODE -ne 0) {
            throw 'Runtime smoke tests failed.'
          }

      - if: always()
        name: Write job summary
        run: |
          "## Windows v4 Release x64" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- Runner: ``$env:ImageOS $env:ImageVersion``" >> $env:GITHUB_STEP_SUMMARY
          "- Qt: ``$env:QT_VERSION $env:QT_ARCH``" >> $env:GITHUB_STEP_SUMMARY
          "- Windows SDK: ``$env:WINDOWS_SDK_VERSION``" >> $env:GITHUB_STEP_SUMMARY
          "- OpenSSL tests: ``Safe``" >> $env:GITHUB_STEP_SUMMARY
          "- Configuration: ``$env:BUILD_CONFIGURATION x64``" >> $env:GITHUB_STEP_SUMMARY

          $manifests = Get-ChildItem -LiteralPath output `
            -Filter build-manifest.txt `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue
          if ($manifests) {
            "" >> $env:GITHUB_STEP_SUMMARY
            "### Dependency manifests" >> $env:GITHUB_STEP_SUMMARY
            foreach ($manifest in $manifests) {
              $relative = Resolve-Path -LiteralPath $manifest.FullName -Relative
              $relative = ($relative -replace '^\.\\', '') -replace '\\', '/'
              "- ``$relative``" >> $env:GITHUB_STEP_SUMMARY
            }
          }

      - if: always()
        name: Upload build manifests and test diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: windows-v4-release-diagnostics-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            output/**/build-manifest.txt
            output/**/runtime-manifest.txt
            output/**/Testing/Temporary/**
            output/**/CMakeFiles/CMakeConfigureLog.yaml
