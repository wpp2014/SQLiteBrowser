name: Publish to WinGet (manual only)

on:
  # v4.0.0 is a SQLCipher-only fork release and must not be submitted under
  # the upstream DB Browser for SQLite package identifier automatically.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: DBBrowserForSQLite.DBBrowserForSQLite
          installers-regex: '\.msi$'  # Only .msi files
          token: ${{ secrets.WINGET_TOKEN }}
